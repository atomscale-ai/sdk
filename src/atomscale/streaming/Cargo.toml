[package]
name = "rheed_stream"
version = "0.1.0"
edition = "2021"

[lib]
name = "rheed_stream"
crate-type = ["cdylib"]

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "ansi",
  "tracing-log",
] }
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "http2",
  "charset",
  "system-proxy",
] } # rustls only — default-features off drops native-tls/openssl-sys (unbuildable on manylinux)
bytes = "1.6"
zarrs = { version = "0.23", features = ["zstd"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
dirs = "6"
fs4 = "0.13"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "net", "io-util"] }
