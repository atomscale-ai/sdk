name: Testing

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements/requirements-ubuntu-latest_py3.11.txt
          uv pip install --system -r requirements/requirements-ubuntu-latest_py3.11_extras.txt
          uv pip install --system pre-commit ty

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  preflight:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Cache the Rust build for the streaming extension so `pip install -e .`
      # (setuptools-rust) doesn't recompile reqwest/tokio/zarrs/pyo3 from scratch
      # on every run. The crate lives under src/atomscale/streaming.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/atomscale/streaming"

      - name: Install package
        run: uv pip install --system -e .

      - name: Set SSL_CERT_FILE
        run: echo "SSL_CERT_FILE=$(python -m certifi)" >> $GITHUB_ENV

      # Fail fast (once, before the matrix) with an actionable message when the
      # key is expired/invalid or scoped to the wrong org, rather than surfacing
      # as a misleading failure deep inside the live tests.
      - name: Verify API key and organization
        env:
          AS_API_KEY: ${{ secrets.AS_API_KEY }}
          AS_API_ENDPOINT: "https://api.atomscale.ai"
        run: python scripts/ci_auth_preflight.py

  test:
    needs: preflight
    strategy:
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements/requirements-${{ matrix.os }}_py${{ matrix.python-version }}.txt
          uv pip install --system -r requirements/requirements-${{ matrix.os }}_py${{ matrix.python-version }}_extras.txt

      - name: Set SSL_CERT_FILE (Linux/MacOS)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        run: echo "SSL_CERT_FILE=$(python -m certifi)" >> $GITHUB_ENV

      - name: Set SSL_CERT_FILE (Windows)
        if: matrix.os == 'windows-latest'
        run: echo "SSL_CERT_FILE=$(python -m certifi)" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      # Cache the Rust build for the streaming extension so `pip install -e .`
      # (setuptools-rust) doesn't recompile reqwest/tokio/zarrs/pyo3 from scratch
      # in every one of the 12 matrix jobs. Sharded by Python version because the
      # pyo3 cdylib links against the interpreter; OS/rustc are keyed automatically.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/atomscale/streaming"
          key: py${{ matrix.python-version }}

      - name: Install package
        run: uv pip install --system -e .

      - name: Test with pytest
        env:
          AS_API_KEY: ${{ secrets.AS_API_KEY }}
          AS_API_ENDPOINT: "https://api.atomscale.ai"
        run: pytest -x

  auto-gen-release:
    needs: test
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: rymndhng/release-on-push-action@v0.28.0
        with:
          bump_version_scheme: norelease
