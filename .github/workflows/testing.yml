name: Testing

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.20"  # keep in step with required-version in pyproject.toml
          python-version: "3.11"
          activate-environment: true

      # uv.lock is the only source of dependency versions, and CI installs from it with
      # `uv sync --locked`. The requirements files (for installing with pip) are
      # generated from it by scripts/export_requirements.sh.
      - name: uv.lock matches pyproject.toml
        run: |
          if ! uv lock --check; then
            echo "::error::uv.lock is out of date with pyproject.toml. Run \`uv lock\` then \`scripts/export_requirements.sh\` and commit the results."
            exit 1
          fi

      - name: Requirements files match uv.lock
        run: |
          scripts/export_requirements.sh
          if [ -n "$(git status --porcelain -- requirements)" ]; then
            git status --short -- requirements
            git diff -- requirements
            echo "::error::requirements/ differs from uv.lock. These files are generated, not edited: run \`scripts/export_requirements.sh\` and commit the results."
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  preflight:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.20"  # keep in step with required-version in pyproject.toml
          python-version: "3.11"
          activate-environment: true

      - name: Install package
        run: uv sync --locked

      - name: Set SSL_CERT_FILE
        run: echo "SSL_CERT_FILE=$(python -m certifi)" >> $GITHUB_ENV

      # Fail fast (once, before the matrix) with an actionable message when the
      # key is expired/invalid or scoped to the wrong org, rather than surfacing
      # as a misleading failure deep inside the live tests.
      - name: Verify API key and organization
        env:
          AS_API_KEY: ${{ secrets.AS_API_KEY }}
          AS_API_ENDPOINT: "https://api.atomscale.ai"
        run: python scripts/ci_auth_preflight.py

  test:
    needs: preflight
    strategy:
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.20"  # keep in step with required-version in pyproject.toml
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Set SSL_CERT_FILE (Linux/MacOS)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        run: echo "SSL_CERT_FILE=$(python -m certifi)" >> $GITHUB_ENV

      - name: Set SSL_CERT_FILE (Windows)
        if: matrix.os == 'windows-latest'
        run: echo "SSL_CERT_FILE=$(python -m certifi)" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test with pytest
        env:
          AS_API_KEY: ${{ secrets.AS_API_KEY }}
          AS_API_ENDPOINT: "https://api.atomscale.ai"
        run: pytest -x

  auto-gen-release:
    needs: test
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: rymndhng/release-on-push-action@v0.28.0
        with:
          bump_version_scheme: norelease
