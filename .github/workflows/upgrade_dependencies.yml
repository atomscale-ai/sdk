name: Upgrade Dependencies

# Re-resolve uv.lock to the newest versions pyproject.toml allows, regenerate the
# requirements files from it, and open (or refresh) one PR. "Newest" honours the
# 7-day cooldown (exclude-newer in pyproject.toml), so a release has to survive a
# week on PyPI before it lands here. One lock covers every OS and Python version, so
# there is nothing to resolve per platform: the PR's Testing workflow tests the new
# lock on the full OS x Python matrix.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: auto-dependency-upgrades

jobs:
  upgrade:
    name: Upgrade uv.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Always upgrade main, whichever branch the run was dispatched from: Testing
          # only runs on PRs into main, and every run force-pushes the one $BRANCH.
          ref: main
          # Pushes made with the default GITHUB_TOKEN don't trigger workflows, so a
          # refreshed branch on an already-open PR would never get CI.
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.20"  # keep in step with required-version in pyproject.toml

      - name: Upgrade uv.lock and regenerate requirements
        run: |
          set -o pipefail
          uv lock --upgrade 2>&1 | tee "$RUNNER_TEMP/uv-lock.log"
          scripts/export_requirements.sh

      - name: Summarize upgrades
        run: |
          python3 scripts/summarize_uv_lock_upgrade.py \
            < "$RUNNER_TEMP/uv-lock.log" > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- uv.lock requirements)" ]; then
            echo "uv.lock is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -B "$BRANCH"
          git add uv.lock requirements
          git commit -m "Upgrade dependencies" \
            -m "uv lock --upgrade, then scripts/export_requirements.sh."
          git push -f origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "\`uv lock --upgrade\`, with the requirements files regenerated from the new lock."
            echo "Only releases older than the 7-day cooldown are eligible."
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Full log: $RUN_URL (THIS IS AN AUTOMATED PR)"
          } > "$RUNNER_TEMP/body.md"
          PR=$(gh pr list --head "$BRANCH" --json number -q '.[0].number')
          if [ -z "$PR" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Automated dependency upgrades" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$PR" --body-file "$RUNNER_TEMP/body.md"
          fi
