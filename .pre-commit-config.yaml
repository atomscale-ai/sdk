default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg]

ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        stages: [pre-commit, commit-msg]
        exclude_types: [json, bib, svg]
        args: [--ignore-words-list, "mater,fwe,te"]

  # ruff and ty run from the project environment (`uv sync --extra dev`), so they
  # use the versions pinned in uv.lock rather than a separate hook rev.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --force-exclude --fix --show-fixes
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ty
        name: ty
        entry: ty check src/atomicds
        language: system
        types: [python]
        pass_filenames: false
